services:
  richmack-georgia:
    build: .
    container_name: richmack-georgia
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:5075:5075"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5075/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
