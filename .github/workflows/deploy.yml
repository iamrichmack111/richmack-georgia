name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: richmack-georgia-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m compileall -q app run.py
          python -m pytest -q

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.RICHMACK_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.RICHMACK_DEPLOY_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/richmackos_deploy
          chmod 600 ~/.ssh/richmackos_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sync application
        env:
          DEPLOY_HOST: ${{ secrets.RICHMACK_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.RICHMACK_DEPLOY_USER }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/richmackos_deploy -o IdentitiesOnly=yes" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude 'data/' \
            --exclude 'backups/' \
            --exclude '.venv/' \
            --exclude '__pycache__/' \
            --exclude '.pytest_cache/' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/home/ubuntu/richmack-georgia/"

      - name: Deploy with richdeploy
        env:
          DEPLOY_HOST: ${{ secrets.RICHMACK_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.RICHMACK_DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/richmackos_deploy -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'richdeploy georgia'

      - name: Verify public health
        run: |
          READY=0
          for i in $(seq 1 20); do
            if curl -fsS https://georgia.richmackos.com/health; then
              READY=1
              break
            fi
            sleep 3
          done
          test "$READY" -eq 1
