name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app run.py
      - name: Run tests
        run: pytest -q
      - name: Validate GeoJSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('app/static/data').glob('*.geojson'):
              with path.open() as f:
                  data = json.load(f)
              assert data.get('type') == 'FeatureCollection', path
              print(path, len(data.get('features', [])), 'features')
          PY
      - name: Build container
        run: docker build -t richmack-georgia:ci .
